name: Private context spill lifecycle
description: Run the candidate CLI with an oversized context, concurrent spill consumers, planted legacy path, and required-JSON cleanup (Linux; requires bash, realpath, and Python 3).
version: "1.0.0"
config:
  timeout: 180000
  retries: 0
  parallel: false
environment:
  requires: [RECIPE_RUNNER_QA_BINARY]
agents:
  - name: cli-agent
    type: cli
    config:
      defaultTimeout: 180000
steps:
  - name: Candidate context-file lifecycle
    agent: cli-agent
    action: execute_command
    target: bash tests/qa/context-tempfile.sh
    timeout: 180000
assertions: []
metadata:
  tags: [recipe-runner, context-file, security, cleanup]
  priority: critical
