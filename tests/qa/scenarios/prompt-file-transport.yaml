name: Private agent prompt transport (#205)
description: Run Linux Rust behavior tests against live wrapper stubs for Claude, Codex, and Copilot. Verify private argv, complete delivery, permissions, cleanup, failures, and handled signals.
version: "1.0.0"
config:
  timeout: 180000
  retries: 0
  parallel: false
agents:
  - name: cli-agent
    type: cli
    config:
      defaultTimeout: 180000
steps:
  - name: Private wrapper transport and cleanup
    agent: cli-agent
    action: execute_command
    target: bash tests/qa/prompt-file-transport.sh
    timeout: 180000
assertions: []
metadata:
  tags: [recipe-runner, claude, codex, copilot, transport, regression, issue-205]
  priority: critical
