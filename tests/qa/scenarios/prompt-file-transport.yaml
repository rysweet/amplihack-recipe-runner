name: Over-32KiB agent prompt file transport (#159, #205)
description: Run the candidate with a >32 KiB agent prompt through an isolated fake launcher; Claude must receive the system prompt via --system-prompt-file and the task on stdin behind a bare -p, and Copilot's request must name the prompt file (Unix QA; requires bash, realpath, and Python 3).
version: "1.0.0"
config:
  timeout: 180000
  retries: 0
  parallel: false
environment:
  requires: [RECIPE_RUNNER_QA_BINARY]
agents:
  - name: cli-agent
    type: cli
    config:
      defaultTimeout: 180000
steps:
  - name: Claude system file and stdin task, Copilot path-naming request
    agent: cli-agent
    action: execute_command
    target: bash tests/qa/prompt-file-transport.sh
    timeout: 180000
assertions: []
metadata:
  tags: [recipe-runner, claude, copilot, transport, regression, issue-159, issue-205]
  priority: critical
